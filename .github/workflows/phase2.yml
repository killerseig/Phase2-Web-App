name: Phase 2 validation and Hosting

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm --prefix functions ci
      - name: Test Hosting release safety
        run: node --test scripts/hosting-release.test.mjs
      - name: Test Forms, Jobs and Library
        run: >-
          npx vitest run src/components/builder src/components/forms src/features/builder
          src/features/forms src/components/jobs/JobFormsList.spec.ts src/services/forms.spec.ts
          src/views/CompanyLibraryView.spec.ts src/views/FormBuilderPublishing.spec.ts
          src/views/FormBuilderSupplied.spec.ts src/views/FormBuilderView.spec.ts
          src/views/FormSubmissionView.spec.ts
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Shop Orders predeploy gate (47 cases)
        run: npm run test:shop-order-layout
      - name: Build and type-check production source
        run: node scripts/build-hosting-ci.mjs
      - name: Preserve validated employee artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: employee-hosting-${{ github.sha }}
          path: hosting-dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy main to Firebase Hosting
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: phase2-production-hosting
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require separately approved deployment identity
        env:
          APPROVED: ${{ vars.PHASE2_DEPLOY_AUTH_APPROVED }}
          PROVIDER: ${{ vars.PHASE2_WIF_PROVIDER }}
          ACCOUNT: ${{ vars.PHASE2_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          if [ "$APPROVED" != "true" ] || [ -z "$PROVIDER" ] || [ -z "$ACCOUNT" ]; then
            echo '::error::Automatic Hosting deployment is blocked pending specific approval and configuration of a least-privilege CI identity. No cloud authentication or deployment attempted.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: employee-hosting-${{ github.sha }}
          path: hosting-dist
      # No key, trust provider, IAM binding or repository variable is created here.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: phase2-website
          workload_identity_provider: ${{ vars.PHASE2_WIF_PROVIDER }}
          service_account: ${{ vars.PHASE2_DEPLOY_SERVICE_ACCOUNT }}
      - name: Release employee frontend, preserving public website and backend
        run: node scripts/hosting-release.mjs
      - name: Check delivered Shop Orders CSS
        run: |
          mkdir -p dist
          cp -R hosting-dist/assets dist/assets
          node scripts/verify-shop-order-layout-live.mjs https://phase2-website.web.app/
      - name: Preserve release and rollback receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosting-receipt-${{ github.sha }}
          path: release-receipt.json
          if-no-files-found: ignore
          retention-days: 90
